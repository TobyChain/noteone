<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>微信公众号配置</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="page-header">
      <h1>微信公众号</h1>
      <a href="https://github.com/TobyChain" target="_blank" rel="noopener" class="gh-link" title="GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.4.5 0 5.9 0 12.5c0 5.3 3.4 9.8 8.2 11.4.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 016 0C17.3 4.8 18.3 5.1 18.3 5.1c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0024 12.5C24 5.9 18.6.5 12 .5z"/></svg>
      </a>
    </div>

    <!-- 登录状态卡片 -->
    <section class="card" id="login-card">
      <div class="card-header">
        <h2>公众平台登录</h2>
        <span class="badge" id="login-badge">检测中…</span>
      </div>
      <div id="login-status" class="muted">正在检测登录状态…</div>
      <div id="qr-area" class="hidden">
        <img id="qr-img" alt="登录二维码">
        <p class="muted" id="qr-msg">使用微信扫码并确认登录</p>
      </div>
      <div class="row">
        <button id="btn-login" class="hidden">扫码登录</button>
        <button id="btn-relogin" class="secondary hidden">重新扫码</button>
        <button id="btn-logout" class="danger hidden">退出登录</button>
      </div>
    </section>

    <!-- 公众号订阅卡片 -->
    <section class="card">
      <div class="card-header">
        <h2>订阅的公众号</h2>
        <span class="badge" id="mp-count"></span>
      </div>
      <ul id="mp-list" class="mp-list"></ul>
      <p class="muted hidden" id="mp-empty">还没有订阅公众号，先在下方搜索添加。</p>

      <div class="search-box">
        <input id="search-input" type="text" placeholder="搜索公众号名称…">
        <button id="btn-search">搜索</button>
      </div>
      <ul id="search-results" class="mp-list"></ul>
    </section>

    <!-- 抓取参数卡片 -->
    <section class="card">
      <div class="card-header"><h2>抓取参数</h2></div>
      <label>每个公众号最多抓取文章数
        <input id="limit-per-mp" type="number" min="1" max="100">
      </label>
      <label>只保留最近 N 天的文章
        <input id="days-recent" type="number" min="1" max="365">
      </label>
      <p class="muted">为降低微信频控风险，文章列表请求至少间隔 15 秒；触发频控后会暂停 60 分钟。微信未公开精确配额，严重时可能需要等待更久。</p>
      <div class="row">
        <button id="btn-save">保存参数</button>
      </div>
    </section>

    <p class="toast hidden" id="toast"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
