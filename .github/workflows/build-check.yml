name: Build check

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund --replace-registry-host=always --registry=https://registry.npmjs.org/

      - name: Build and unit-test server
        working-directory: server
        run: |
          npm run build
          npm run test:run

      - name: Build and test Apple clients (unsigned)
        working-directory: apple
        run: |
          xcodegen generate
          xcodebuild -quiet test -project NoteOne.xcodeproj -scheme NoteOne_macOS \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO
          simulator_id="$(xcrun simctl list devices available \
            | awk -F '[()]' '/iPhone/ && !found { id=$2; found=1 } END { print id }')"
          test -n "$simulator_id" || { echo "No available iPhone simulator" >&2; exit 1; }
          xcodebuild -quiet test -project NoteOne.xcodeproj -scheme NoteOne_iOS \
            -destination "platform=iOS Simulator,id=$simulator_id" CODE_SIGNING_ALLOWED=NO
