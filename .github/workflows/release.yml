name: Release macOS DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)".*/\1/p' apple/project.yml | head -1)"
          test "$tag_version" = "$project_version" || {
            echo "Tag $tag_version does not match project version $project_version" >&2
            exit 1
          }

      - name: Install build tools
        run: brew install xcodegen

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund --replace-registry-host=always --registry=https://registry.npmjs.org/

      - name: Test server
        working-directory: server
        run: |
          npm run build
          npm run test:run
          npm run test:integration

      - name: Test Apple clients
        working-directory: apple
        run: |
          xcodegen generate
          xcodebuild -quiet test -project NoteOne.xcodeproj -scheme NoteOne_macOS \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO
          xcodebuild -quiet test -project NoteOne.xcodeproj -scheme NoteOne_iOS \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' CODE_SIGNING_ALLOWED=NO

      - name: Build DMG
        env:
          NOTEONE_SIGN_IDENTITY: "-"
        run: bash scripts/package-dmg.sh dist

      - name: Verify artifact
        run: |
          test -f dist/NoteOne.dmg
          shasum -a 256 dist/NoteOne.dmg | tee dist/NoteOne.dmg.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NoteOne ${{ github.ref_name }}
          body: |
            ## 安全与可靠性

            - 默认仅监听本机；远程部署必须显式配置初始化访问令牌。
            - 浏览器扩展与 App 使用同一本地数据空间。
            - 移除闹闹通用 shell 执行，仅保留受限的结构化文件工具。
            - 搜索支持语义检索失败时自动降级全文检索。
            - 笔记列表使用稳定游标分页，AI 状态轮询不再重复拉取全量数据。
            - 完善导入、导出、垃圾箱和本地数据清除的数据完整性。
            - 修复 iOS Share Extension 与 Swift 6 的兼容问题。
            - 新增 PGlite 集成测试及 macOS/iOS XCTest。

            数据仍保存在 `~/Library/Application Support/NoteOne`，覆盖安装不会删除已有数据。
          files: |
            dist/NoteOne.dmg
            dist/NoteOne.dmg.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Update Homebrew cask on main
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha256="$(shasum -a 256 dist/NoteOne.dmg | awk '{print $1}')"
          git fetch origin main
          git switch -C main origin/main
          ruby - "$version" "$sha256" <<'RUBY'
          path = "homebrew/Casks/noteone.rb"
          version, sha256 = ARGV
          content = File.read(path)
          content.sub!(/version "[^"]+"/, "version \"#{version}\"")
          content.sub!(/sha256 "[0-9a-f]+"/, "sha256 \"#{sha256}\"")
          File.write(path, content)
          RUBY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homebrew/Casks/noteone.rb
          git diff --cached --quiet || git commit -m "chore: update homebrew cask to ${GITHUB_REF_NAME}"
          git push origin main
