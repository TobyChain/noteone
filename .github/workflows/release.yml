name: Release macOS DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)".*/\1/p' apple/project.yml | head -1)"
          test "$tag_version" = "$project_version" || {
            echo "Tag $tag_version does not match project version $project_version" >&2
            exit 1
          }

      - name: Install build tools
        run: brew install xcodegen

      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund --replace-registry-host=always --registry=https://registry.npmjs.org/

      - name: Test server
        working-directory: server
        run: |
          npm run build
          npm run test:run
          npm run test:integration

      - name: Test Apple clients
        working-directory: apple
        run: |
          xcodegen generate
          xcodebuild -quiet test -project NoteOne.xcodeproj -scheme NoteOne_macOS \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "$simulator_id" || { echo "No available iPhone simulator" >&2; exit 1; }
          xcodebuild -quiet test -project NoteOne.xcodeproj -scheme NoteOne_iOS \
            -destination "platform=iOS Simulator,id=$simulator_id" CODE_SIGNING_ALLOWED=NO

      - name: Build DMG
        run: bash scripts/package-dmg.sh dist

      - name: Verify artifact
        run: |
          test -f dist/NoteOne.dmg
          shasum -a 256 dist/NoteOne.dmg | tee dist/NoteOne.dmg.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NoteOne ${{ github.ref_name }}
          body: |
            开源个人知识系统，内嵌 Node 运行时与 PGlite 数据库，无需外部依赖，首次启动自动建库。

            ## 本次更新

            - 新增高见（FarView）：最近 7 天全局话题热度 Top 10，过滤噪声词，展示来源构成与代表内容。
            - 统一模块命名与导航：高见（FarView）→ 新知（NewLore）→ 往事（OldEcho）。
            - 优化全局顺手记：⌘⇧O 唤起、首次权限说明、自动填入选中文本。
            - 修复高见与新知的自然日/时区口径。

            ## 安装说明

            - 仅支持 Apple Silicon（arm64）、macOS 14+。
            - DMG 采用 ad-hoc 签名。首次打开若提示“无法验证开发者”，在「系统设置 → 隐私与安全性」点击“仍要打开”。
            - 数据保存在 `~/Library/Application Support/NoteOne`，覆盖安装不会删除已有数据。
          files: |
            dist/NoteOne.dmg
            dist/NoteOne.dmg.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Update Homebrew cask on main
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha256="$(shasum -a 256 dist/NoteOne.dmg | awk '{print $1}')"
          git fetch origin main
          git switch -C main origin/main
          ruby - "$version" "$sha256" <<'RUBY'
          path = "homebrew/Casks/noteone.rb"
          version, sha256 = ARGV
          content = File.read(path)
          content.sub!(/version "[^"]+"/, "version \"#{version}\"")
          content.sub!(/sha256 "[0-9a-f]+"/, "sha256 \"#{sha256}\"")
          File.write(path, content)
          RUBY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homebrew/Casks/noteone.rb
          git diff --cached --quiet || git commit -m "chore: update homebrew cask to ${GITHUB_REF_NAME}"
          git push origin main
